appId: com.messs.desktop
productName: Messs
electronVersion: 43.2.0
asar: true
directories:
  output: release-dev
files:
  - main.js
  - preload.js
  - package.json
  - config/runtime.json
  - config/provider-catalog.json
  - config/agent-routing.json
  - lib/**/*
  - src/**/*
  - vendor/**/*
  - scripts/**/*
  - node_modules/@napi-rs/**/*
  - node_modules/pdfjs-dist/**/*
  - node_modules/electron-screenshots/**/*
  - node_modules/node-screenshots/**/*
  - node_modules/node-screenshots-win32-x64-msvc/**/*
  - node_modules/react-screenshots/**/*
  - node_modules/react/**/*
  - node_modules/react-dom/**/*
  - node_modules/scheduler/**/*
  - node_modules/debug/**/*
  - node_modules/ms/**/*
  - node_modules/fs-extra/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - "!release{,/**/*}"
  - "!release-dev{,/**/*}"
asarUnpack:
  - lib/agent-memory-search.cjs
  - node_modules/minisearch/**/*
  - lib/ai-work-worker.cjs
  - node_modules/quickjs-emscripten/**/*
  - node_modules/quickjs-emscripten-core/**/*
  - node_modules/@jitl/**/*
  - node_modules/ffmpeg-static/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/@napi-rs/**/*
  - node_modules/pdfjs-dist/**/*
  - node_modules/node-screenshots/**/*
  - node_modules/node-screenshots-win32-x64-msvc/**/*
extraResources:
  - from: build-resources/tools
    to: tools
    filter:
      - "**/*"
win:
  icon: build-resources/icon.png
  target: dir
  signAndEditExecutable: false
