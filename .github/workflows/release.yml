name: Build and publish Messs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver version without v, for example 0.0.3"
        required: true
      macos_only:
        description: "Only rebuild and replace the macOS assets for an existing release"
        required: false
        type: boolean
        default: false
      replace_existing:
        description: "Allow a manually dispatched build to replace assets in an existing public release"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  windows-release:
    if: ${{ inputs.macos_only != true }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      MESSS_SUPABASE_URL: https://trmbhcniijedpmohkbzx.supabase.co
      MESSS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      MESSS_AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Install gateway dependencies
        run: npm --prefix gateway ci

      - name: Bundle document preview tools
        shell: pwsh
        run: |
          $libreOffice = Join-Path $env:ProgramFiles 'LibreOffice'
          $libreOfficeExe = Join-Path $libreOffice 'program\soffice.exe'
          if (-not (Test-Path $libreOfficeExe)) {
            $libreOfficeVersion = '26.2.3'
            $libreOfficeMsi = Join-Path $env:RUNNER_TEMP "LibreOffice-$libreOfficeVersion.msi"
            $libreOfficeUrl = "https://download.documentfoundation.org/libreoffice/stable/$libreOfficeVersion/win/x86_64/LibreOffice_${libreOfficeVersion}_Win_x86-64.msi"
            # Bound both network and installer waits so a hosted runner cannot
            # consume the entire workflow indefinitely when a mirror stalls.
            Invoke-WebRequest -Uri $libreOfficeUrl -OutFile $libreOfficeMsi -UseBasicParsing -TimeoutSec 300
            $install = Start-Process msiexec.exe -ArgumentList @('/i', $libreOfficeMsi, '/qn', '/norestart') -PassThru
            if (-not $install.WaitForExit(300000)) {
              Stop-Process -Id $install.Id -Force -ErrorAction SilentlyContinue
              throw 'LibreOffice MSI installation timed out after 300 seconds.'
            }
            if ($install.ExitCode -notin @(0, 3010)) { throw "LibreOffice MSI failed with exit code $($install.ExitCode)." }
          }
          choco install imagemagick.app --no-progress -y --execution-timeout=600
          $imageMagick = Get-ChildItem -Directory $env:ProgramFiles |
            Where-Object Name -Like 'ImageMagick-*' |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not (Test-Path $libreOfficeExe)) { throw 'LibreOffice was not installed from the official installer.' }
          if (-not $imageMagick -or -not (Test-Path (Join-Path $imageMagick.FullName 'magick.exe'))) { throw 'ImageMagick was not installed.' }
          Remove-Item build-resources/tools/libreoffice -Recurse -Force
          Remove-Item build-resources/tools/imagemagick -Recurse -Force
          Copy-Item $libreOffice build-resources/tools/libreoffice -Recurse
          Copy-Item $imageMagick.FullName build-resources/tools/imagemagick -Recurse

      - name: Set release version and runtime config
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { '${{ inputs.version }}' } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw "Invalid semver: $version" }
          "MESSS_RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "MESSS_RELEASE_TAG=v$version" >> $env:GITHUB_ENV
          npm version $version --no-git-tag-version --allow-same-version
          npm pkg set repository.type=git "repository.url=https://github.com/${{ github.repository }}.git"
          $config = @{
            supabaseUrl = $env:MESSS_SUPABASE_URL
            supabasePublishableKey = $env:MESSS_SUPABASE_PUBLISHABLE_KEY
            aiGatewayUrl = $env:MESSS_AI_GATEWAY_URL
            githubOwner = 'a1804927460-bot'
            githubRepo = 'messs-releases'
          } | ConvertTo-Json
          Set-Content -LiteralPath config/runtime.json -Value $config -Encoding utf8

      - name: Validate release configuration
        env:
          SIGNING_CERT_PRESENT: ${{ secrets.CSC_LINK != '' }}
          SIGNING_PASSWORD_PRESENT: ${{ secrets.CSC_KEY_PASSWORD != '' }}
        shell: pwsh
        run: |
          $config = Get-Content -Raw config/runtime.json | ConvertFrom-Json
          if (-not $config.supabasePublishableKey) { throw 'Repository variable SUPABASE_PUBLISHABLE_KEY is missing.' }
          if ($config.aiGatewayUrl -notmatch '^https://') { throw 'Repository variable AI_GATEWAY_URL must be HTTPS.' }
          if ($config.githubOwner -ne 'a1804927460-bot' -or $config.githubRepo -ne 'messs-releases') { throw 'Public updater repository is misconfigured.' }
          if (-not $env:GH_TOKEN) { throw 'RELEASES_TOKEN is missing.' }
          if ($env:SIGNING_CERT_PRESENT -ne $env:SIGNING_PASSWORD_PRESENT) {
            throw 'CSC_LINK and CSC_KEY_PASSWORD must be configured together.'
          }
          $signingEnabled = $env:SIGNING_CERT_PRESENT -eq 'true'
          "MESSS_SIGNING_ENABLED=$($signingEnabled.ToString().ToLowerInvariant())" >> $env:GITHUB_ENV
          if (-not $signingEnabled) {
            Write-Warning 'Publishing an unsigned internal build because no code-signing certificate is configured.'
          }

      - name: Test
        run: npm test

      - name: Build Windows update
        run: npm run release:win
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}

      - name: Verify updater artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path release/latest.yml)) { throw 'latest.yml was not generated.' }
          $installer = Get-ChildItem release -Filter 'Messs-*-Setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          $blockmap = Get-Item "$($installer.FullName).blockmap" -ErrorAction SilentlyContinue
          if (-not $blockmap) { throw 'Windows installer blockmap was not generated.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($env:MESSS_SIGNING_ENABLED -eq 'true') {
            if ($signature.Status -ne 'Valid' -or -not $signature.SignerCertificate) {
              throw "Installer Authenticode signature is not valid: $($signature.Status)"
            }
          } elseif ($signature.Status -ne 'NotSigned') {
            throw "Unsigned build has an unexpected Authenticode state: $($signature.Status)"
          }
          $manifest = Get-Content -Raw release/latest.yml
          if ($manifest -notmatch "(?m)^version:\s*$([regex]::Escape($env:MESSS_RELEASE_VERSION))\s*$") {
            throw "latest.yml does not declare version $env:MESSS_RELEASE_VERSION."
          }
          if ($manifest -notmatch [regex]::Escape($installer.Name)) {
            throw 'latest.yml does not reference the generated installer.'
          }
          "MESSS_INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          "MESSS_BLOCKMAP_PATH=$($blockmap.FullName)" >> $env:GITHUB_ENV
          Write-Host "Verified $($installer.Name), $($blockmap.Name), latest.yml, and signing state $($signature.Status)"

      - name: Publish verified updater artifacts
        shell: pwsh
        run: |
          $repo = 'a1804927460-bot/messs-releases'
          $assets = @($env:MESSS_INSTALLER_PATH, $env:MESSS_BLOCKMAP_PATH, (Resolve-Path release/latest.yml).Path)
          $draftState = & gh release view $env:MESSS_RELEASE_TAG --repo $repo --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            $replaceExisting = '${{ inputs.replace_existing }}' -eq 'true'
            if ($draftState -ne 'true' -and -not $replaceExisting) {
              throw 'This release tag is already public; use a manually dispatched build with replace_existing=true to replace its assets.'
            }
          } else {
            & gh release create $env:MESSS_RELEASE_TAG --repo $repo --target main --draft `
              --title "Messs $env:MESSS_RELEASE_TAG" `
              --notes "Messs $env:MESSS_RELEASE_TAG Windows update."
            if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed.' }
          }
          & gh release upload $env:MESSS_RELEASE_TAG @assets --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Uploading the verified updater artifacts failed.' }
          & gh release edit $env:MESSS_RELEASE_TAG --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the verified draft release failed.' }

  macos-release:
    # Windows remains the release gate. macOS then adds both architectures to
    # the same public release so electron-updater can consume latest-mac.yml.
    needs: windows-release
    if: ${{ always() && (inputs.macos_only == true || needs.windows-release.result == 'success') }}
    # macos-13 no longer receives standard hosted runners. macos-14 remains
    # Intel-based, which lets electron-builder produce both x64 and arm64.
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
      MESSS_SUPABASE_URL: https://trmbhcniijedpmohkbzx.supabase.co
      MESSS_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      MESSS_AI_GATEWAY_URL: ${{ vars.AI_GATEWAY_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install desktop dependencies
        run: npm ci

      - name: Set release version and runtime config
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver: $version" >&2
            exit 1
          fi
          echo "MESSS_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "MESSS_RELEASE_TAG=v$version" >> "$GITHUB_ENV"
          npm version "$version" --no-git-tag-version --allow-same-version
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            supabaseUrl: process.env.MESSS_SUPABASE_URL,
            supabasePublishableKey: process.env.MESSS_SUPABASE_PUBLISHABLE_KEY,
            aiGatewayUrl: process.env.MESSS_AI_GATEWAY_URL,
            githubOwner: 'a1804927460-bot',
            githubRepo: 'messs-releases'
          };
          fs.writeFileSync('config/runtime.json', `${JSON.stringify(config, null, 2)}\n`, 'utf8');
          NODE

      - name: Validate macOS release configuration
        shell: bash
        env:
          SIGNING_CERT_PRESENT: ${{ secrets.CSC_LINK != '' }}
          SIGNING_PASSWORD_PRESENT: ${{ secrets.CSC_KEY_PASSWORD != '' }}
          CSC_LINK_VALUE: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD_VALUE: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          node - <<'NODE'
          const config = require('./config/runtime.json');
          if (!config.supabasePublishableKey) throw new Error('Repository variable SUPABASE_PUBLISHABLE_KEY is missing.');
          if (!/^https:\/\//.test(config.aiGatewayUrl || '')) throw new Error('Repository variable AI_GATEWAY_URL must be HTTPS.');
          if (config.githubOwner !== 'a1804927460-bot' || config.githubRepo !== 'messs-releases') throw new Error('Public updater repository is misconfigured.');
          NODE
          if [ -z "$GH_TOKEN" ]; then echo 'RELEASES_TOKEN is missing.' >&2; exit 1; fi
          if [ "$SIGNING_CERT_PRESENT" != "$SIGNING_PASSWORD_PRESENT" ]; then
            echo 'CSC_LINK and CSC_KEY_PASSWORD must be configured together.' >&2
            exit 1
          fi
          if [ "$SIGNING_CERT_PRESENT" != 'true' ]; then
            echo 'Publishing an unsigned macOS internal build because no signing certificate is configured.' >&2
            # Do not export empty CSC_LINK/CSC_KEY_PASSWORD values. electron-builder
            # interprets an empty CSC_LINK as the current working directory.
            echo 'CSC_IDENTITY_AUTO_DISCOVERY=false' >> "$GITHUB_ENV"
          else
            echo "CSC_LINK=$CSC_LINK_VALUE" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD_VALUE" >> "$GITHUB_ENV"
            echo 'CSC_IDENTITY_AUTO_DISCOVERY=true' >> "$GITHUB_ENV"
          fi

      - name: Test
        run: npm test

      - name: Build macOS updater artifacts
        run: npm run release:mac
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Verify macOS updater artifacts
        shell: bash
        run: |
          test -f release/latest-mac.yml || { echo 'latest-mac.yml was not generated.' >&2; exit 1; }
          test "$(find release -maxdepth 1 -name 'Messs-*-x64.dmg' | wc -l)" -ge 1 || { echo 'Intel DMG was not generated.' >&2; exit 1; }
          test "$(find release -maxdepth 1 -name 'Messs-*-arm64.dmg' | wc -l)" -ge 1 || { echo 'Apple Silicon DMG was not generated.' >&2; exit 1; }
          test "$(find release -maxdepth 1 -name 'Messs-*-x64.zip' | wc -l)" -ge 1 || { echo 'Intel ZIP was not generated.' >&2; exit 1; }
          test "$(find release -maxdepth 1 -name 'Messs-*-arm64.zip' | wc -l)" -ge 1 || { echo 'Apple Silicon ZIP was not generated.' >&2; exit 1; }
          grep -Eq "^version: $MESSS_RELEASE_VERSION$" release/latest-mac.yml || { echo 'latest-mac.yml has the wrong version.' >&2; exit 1; }

      - name: Publish macOS updater artifacts
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release/latest-mac.yml release/*.dmg release/*.zip)
          if [ "${#assets[@]}" -lt 5 ]; then echo 'macOS release asset set is incomplete.' >&2; exit 1; fi
          gh release upload "$MESSS_RELEASE_TAG" "${assets[@]}" --repo a1804927460-bot/messs-releases --clobber
