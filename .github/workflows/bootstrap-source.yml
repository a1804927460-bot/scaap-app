name: Bootstrap verified source

on:
  push:
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand verified source archive
        shell: bash
        run: |
          unzip -oq messs-source-c3fea8a.zip
          rm -f messs-source-c3fea8a.zip .github/workflows/bootstrap-source.yml .github/workflows/release.yml
      - name: Commit source tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import verified Messs v0.0.1 source'
          git push
