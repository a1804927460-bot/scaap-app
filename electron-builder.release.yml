appId: com.messs.desktop
productName: Messs
electronVersion: 43.2.0
asar: true
directories:
  output: release
files:
  - main.js
  - preload.js
  - package.json
  - config/runtime.json
  - config/provider-catalog.json
  - lib/**/*
  - src/**/*
  - vendor/**/*
  - node_modules/@napi-rs/**/*
  - node_modules/pdfjs-dist/**/*
  - node_modules/electron-screenshots/**/*
  - node_modules/node-screenshots/**/*
  - node_modules/node-screenshots-win32-x64-msvc/**/*
  - node_modules/react-screenshots/**/*
  - node_modules/react/**/*
  - node_modules/react-dom/**/*
  - node_modules/scheduler/**/*
  - node_modules/debug/**/*
  - node_modules/ms/**/*
  - node_modules/fs-extra/**/*
  - node_modules/graceful-fs/**/*
  - node_modules/jsonfile/**/*
  - node_modules/universalify/**/*
  - "!release{,/**/*}"
  - "!release-dev{,/**/*}"
asarUnpack:
  - node_modules/ffmpeg-static/**/*
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
  - node_modules/@napi-rs/**/*
  - node_modules/pdfjs-dist/**/*
  - node_modules/node-screenshots/**/*
  - node_modules/node-screenshots-win32-x64-msvc/**/*
extraResources:
  - from: build-resources/tools
    to: tools
    filter:
      - "**/*"
win:
  icon: build-resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
  artifactName: "Messs-${version}-${arch}-Setup.${ext}"
nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  packElevateHelper: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  include: build-resources/installer.nsh
publish:
  provider: github
  owner: a1804927460-bot
  repo: messs-releases
  private: false
  releaseType: release
